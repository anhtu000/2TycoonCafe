<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="%GAME_BG%" />
    <title>%GAME_TITLE%</title>
    <!-- PORTAL_SDK -->
    <style>
      /* Shown before any script runs, so the first paint is never a white page. */
      html, body { background: %GAME_BG%; }
      /* Loading screen while the game code downloads (6 s on fast 3G, check 22/10): the game's name, a cup
         and a moving bar, so nobody thinks the page froze. Inline, so it costs no extra download.
         Core styles #boot-spinner as a small spinner (core/styles.css, loaded later); the rules below win
         over those, and core's BootScene removes this element when its own progress bar takes over. */
      html body #boot-spinner {
        position: fixed; inset: 0; margin: 0; width: auto; height: auto;
        border: 0; border-radius: 0; animation: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff3e0;
        pointer-events: none;
      }
      .boot-cup { width: 96px; height: 96px; animation: boot-bob 1.4s ease-in-out infinite; }
      .boot-title {
        font-weight: 900; font-size: clamp(26px, 6vw, 46px); line-height: 1.15;
        text-align: center; padding: 0 16px; text-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
      }
      .boot-bar { width: min(420px, 70vw); height: 20px; border-radius: 10px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      .boot-bar i { display: block; height: 100%; width: 34%; border-radius: 10px; background: #ffc23d; animation: boot-slide 1.3s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @keyframes boot-bob { 50% { transform: translateY(-8px); } }
      /* Loading failed: core shows its message in #boot-error, and the loading screen steps aside. */
      #boot-error[style*="block"] ~ #boot-spinner { display: none; }
      @media (prefers-reduced-motion: reduce) { .boot-cup, .boot-bar i { animation-duration: 4s; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-error"></div>
    <div id="boot-spinner" role="status" aria-label="Loading">
      <svg class="boot-cup" viewBox="0 0 96 96" aria-hidden="true">
        <path d="M38 14c-4 6 4 9 0 16M50 10c-4 7 4 11 0 19M62 14c-4 6 4 9 0 16" fill="none" stroke="#fff3e0" stroke-width="4" stroke-linecap="round" opacity="0.7" />
        <path d="M70 46h6a10 10 0 0 1 0 20h-8" fill="none" stroke="#2a1d17" stroke-width="6" />
        <path d="M70 46h6a10 10 0 0 1 0 20h-8" fill="none" stroke="#fff3e0" stroke-width="3" />
        <path d="M20 40h52v18a22 22 0 0 1-22 22h-8a22 22 0 0 1-22-22z" fill="#fff3e0" stroke="#2a1d17" stroke-width="4" />
        <ellipse cx="46" cy="42" rx="24" ry="5" fill="#8a5a3c" />
        <ellipse cx="46" cy="61" rx="6" ry="5" fill="#d98a6a" />
        <circle cx="37" cy="54" r="3" fill="#d98a6a" />
        <circle cx="46" cy="51" r="3" fill="#d98a6a" />
        <circle cx="55" cy="54" r="3" fill="#d98a6a" />
        <path d="M12 82h68" stroke="#2a1d17" stroke-width="5" stroke-linecap="round" opacity="0.5" />
      </svg>
      <div class="boot-title">%GAME_TITLE%</div>
      <div class="boot-bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
